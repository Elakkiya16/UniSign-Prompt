# Vocabulary sizes must include reserved tokens and match your prepared artifacts.
# CSL gloss size, patch size, decoder depth and gamma are implementation defaults; see alignment notes.
data:
  name: RWTH-PHOENIX14T
  language: DGS
  root: datasets
  fps: 25
  resolution: 224
  train_meta: datasets/rwth_train_meta.csv
  val_meta: datasets/rwth_val_meta.csv
  test_meta: datasets/rwth_test_meta.csv
  text_tokenizer: datasets/dgs_bpe.json
  gloss_vocab: datasets/rwth_gloss_vocab.txt
model:
  visual_dim: 1024
  prompt_dim: 768
  hidden_dim: 768
  num_layers: 12
  num_heads: 12
  num_signers: 9
  num_languages: 4
  family_prompt_count: 12
  signer_prompt_count: 8
  num_segments: 4
  top_k: 5
  tau: 1.0
  beta: 0.1
  gamma: 0.1
  decoder_layers: 2
  use_gloss: true
  gloss_vocab_size: 1066
  text_vocab_size: 5000
  pad_id: 0
  bos_id: 1
  eos_id: 2
  max_seq_length: 64
  patch_size: 16
loss:
  lambda_forget: 1.0
  lambda_align: 0.3
  lambda_route: 0.1
  lambda_prompt: 0.1
  lambda_temp: 0.1
  lambda_gloss: 1.0
training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.01
  grad_clip_norm: 1.0
  num_workers: 0
  backbone_checkpoint: null
  output_dir: checkpoints/rwth
